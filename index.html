<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letters for Yashi ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #ffe6ea 0%, #ffccd5 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #4a4a4a;
      font-family: 'Georgia', serif;
      overflow: hidden;
      text-align: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Floating Hearts */
    .hearts-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .floating-heart {
      position: absolute;
      color: #ff4d6d;
      font-size: 20px;
      pointer-events: none;
      animation: floatUp 5s linear forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.6); opacity: 0; }
      20% { opacity: 0.9; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Start Overlay Card - Clean White */
    #start-card {
      position: absolute;
      z-index: 10;
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 20px;
      border: 1px solid rgba(255, 77, 109, 0.2);
      box-shadow: 0 10px 30px rgba(255, 77, 109, 0.2);
      max-width: 90%;
      width: 380px;
    }

    .pulse-heart {
      font-size: 65px;
      color: #ff4d6d;
      animation: heartbeat 1.2s infinite ease-in-out;
      cursor: pointer;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.25); }
      28% { transform: scale(1); }
      42% { transform: scale(1.25); }
      70% { transform: scale(1); }
    }

    /* Main Love Letter Container - White Card */
    #letter-container {
      display: none;
      z-index: 5;
      max-width: 90%;
      width: 380px;
      min-height: 400px;
      background: #ffffff;
      border: 1px solid rgba(255, 77, 109, 0.2);
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 15px 35px rgba(255, 77, 109, 0.25);
      position: relative;
    }

    .card-header {
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: #ff4d6d;
      margin-bottom: 20px;
      text-transform: uppercase;
      font-weight: bold;
    }

    /* Text Container Alignment Fix */
    .text-wrapper {
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }

    .letter-text {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #333333;
      word-break: break-word;
      overflow-wrap: anywhere;
      text-align: center;
    }

    /* Pink Navigation Button */
    .nav-btn {
      margin-top: 25px;
      background: linear-gradient(135deg, #ff4d6d, #ff758c);
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1rem;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
      transition: all 0.3s ease;
      font-family: 'Georgia', serif;
      font-weight: bold;
    }

    .nav-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 6px 20px rgba(255, 77, 109, 0.6);
    }

    .progress-bar {
      font-size: 0.8rem;
      color: #ff4d6d;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Background Canvas -->
  <canvas id="galaxy"></canvas>

  <!-- Piano Audio Track -->
  <audio id="bg-music" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112181.mp3" type="audio/mpeg">
  </audio>

  <!-- Start Trigger Card -->
  <div id="start-card">
    <div class="pulse-heart" onclick="startLetters()">💌</div>
    <h2 style="margin-top: 15px; font-weight: normal; color: #ff4d6d;">Letters For Yashi</h2>
    <p style="margin-top: 8px; font-size: 0.85rem; color: #ff758c;">Tap the envelope to open ❤️</p>
  </div>

  <!-- Main Letter Envelope Deck -->
  <div id="letter-container">
    <div class="card-header" id="card-header">Letter 1</div>
    <div class="text-wrapper">
      <div class="letter-text" id="letter-text"></div>
    </div>
    <button class="nav-btn" onclick="nextLetter()" id="next-btn">Read Next Letter ❤️</button>
    <div class="progress-bar" id="progress-bar">1 / 62</div>
  </div>

  <div class="hearts-container" id="hearts-container"></div>

  <script>
    // --- 1. Soft Floating Particle Background ---
    const canvas = document.getElementById('galaxy');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    for(let i = 0; i < 80; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2,
        alpha: Math.random() * 0.5,
        speed: Math.random() * 0.01
      });
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 77, 109, ${star.alpha})`;
        ctx.fill();
        star.alpha += star.speed;
        if(star.alpha > 0.6 || star.alpha < 0.1) star.speed = -star.speed;
      });
      requestAnimationFrame(drawStars);
    }
    drawStars();

    // --- 2. Floating Hearts ---
    function createHeart() {
      const container = document.getElementById("hearts-container");
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.innerHTML = ['❤️', '💖', '✨', '💕'][Math.floor(Math.random() * 4)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.bottom = '-20px';
      heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
      container.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }

    // --- 3. Love Letter Text Messages Deck ---

    ];

    let currentIndex = 0;
    let charIndex = 0;
    let typingTimer;

    function startLetters() {
      document.getElementById('start-card').style.display = 'none';
      document.getElementById('letter-container').style.display = 'block';
      
      const audio = document.getElementById('bg-music');
      audio.volume = 0.5;
      audio.play().catch(err => {
        console.log("Audio play blocked, user interaction required:", err);
      });

      setInterval(createHeart, 350);
      showLetter();
    }

    function showLetter() {
      const textElem = document.getElementById('letter-text');
      const headerElem = document.getElementById('card-header');
      const progressElem = document.getElementById('progress-bar');
      const nextBtn = document.getElementById('next-btn');

      headerElem.innerText = `Letter ${currentIndex + 1}`;
      progressElem.innerText = `${currentIndex + 1} / ${letters.length}`;
      textElem.textContent = '';
      charIndex = 0;
      clearTimeout(typingTimer);

      if (currentIndex === letters.length - 1) {
        nextBtn.innerText = "❤️ Always & Forever ❤️";
      } else {
        nextBtn.innerText = "Read Next Letter ❤️";
      }

      typeEffect();
    }

    /* Typing Effect */
    function typeEffect() {
      const currentText = letters[currentIndex];
      const textElem = document.getElementById('letter-text');

      if (charIndex < currentText.length) {
        textElem.textContent += currentText.charAt(charIndex);
        charIndex++;
        typingTimer = setTimeout(typeEffect, 30);
      }
    }

    function nextLetter() {
      if (currentIndex < letters.length - 1) {
        currentIndex++;
        showLetter();
      } else {
        currentIndex = 0;
        showLetter();
      }
    }
  </script>
</body>
</html>
